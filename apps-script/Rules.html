    <h2>Studio policies</h2>
    <p>TARDIS is a shared resource for faculty, faculty-supervised student projects, and students actively enrolled in Music Technology coursework. Using the portal means you agree to these policies.</p>

    <h3>Access and reservations</h3>
    <ul>
      <li>Only approved users may use the studio. Unauthorized use is strictly prohibited.</li>
      <li>The studio is open Monday to Sunday, 8am to midnight.</li>
      <li>Students may reserve up to 4 hours per week, in advance, on the studio calendar.</li>
      <li>You may use unreserved, unused time beyond 4 hours, but reservations take priority.</li>
      <li>Cancel on the calendar (or in this portal) with as much notice as you can.</li>
      <li>Recording sessions with more than two musicians must be supervised by a Music Technology work-study student.</li>
    </ul>

    <h3>Security</h3>
    <ul>
      <li>Close the studio doors and turn off the lights when you leave.</li>
      <li>Never prop open the outer door.</li>
      <li>If you find the studio unlocked or open, tell Prof. Chandler right away.</li>
    </ul>

    <h3>Equipment</h3>
    <ul>
      <li>No equipment ever leaves the studio.</li>
      <li>Do not disconnect anything in the control room.</li>
      <li>Handle all gear with care. Damage from negligence may cost you studio privileges.</li>
      <li>Report malfunctions, damage, or missing items immediately, using the Report tab or by telling a work-study student.</li>
    </ul>

    <h3>Cleanliness</h3>
    <ul>
      <li>No food or drinks in the live room or control room, except closed water bottles. Food stays in the entry area.</li>
      <li>Keep cables organized during sessions so they aren't tripping hazards.</li>
      <li>Leave the studio cleaner than you found it: coil cables properly and return gear to its place.</li>
    </ul>

    <h3>Computers and files</h3>
    <ul>
      <li>Studio software is for academic use only. Don't install personal software or change settings.</li>
      <li>Back up your session at the start and end of every session.</li>
      <li>Store data on the TARDIS Data drive in your own folder, for example <span class="mono">TARDIS Data/Your Name/Date - Project/</span>. Unorganized projects may be moved to "Shunned Projects".</li>
      <li>Report software problems to Prof. Chandler.</li>
    </ul>

    <h3>Volume and professionalism</h3>
    <ul>
      <li>Keep monitoring at a safe, comfortable level. The isolation is good; there's no need to test its limits.</li>
      <li>Arrive on time with a plan, and treat collaborators professionally.</li>
      <li>Personal equipment may be stored, organized, in the entry area. The studio isn't responsible for it.</li>
    </ul>

    <h3>Violations</h3>
    <p>Violations lead to progressive action: a verbal warning, temporary suspension, permanent loss of access, or academic penalties depending on severity. Severe or repeated violations, such as intentional damage, can mean immediate loss of access.</p>
