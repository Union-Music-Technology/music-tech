    <h2>How we work</h2>
    <p>Each of you owns an area. You're the person for that thing, and you shouldn't have to wait on Prof. Chandler to know what to do next.</p>

    <h3>Three rules</h3>
    <ol>
      <li>Once you commit to a concert or session, it's yours. If something comes up, find a substitute from the team and confirm it with Prof. Chandler.</li>
      <li>Nothing gets installed on a Deep Freeze machine unless you've gone through the thaw process with someone trained in it.</li>
      <li>A task is done when there's something to show for it: a Drive link, a photo, or a demo at check-in.</li>
    </ol>

    <h3>Hours and check-ins</h3>
    <ul>
      <li>Log flex hours against what you actually did ("2 hrs, labeled TARDIS mic cables, about half done"), not just a number. Use the Hours tab.</li>
      <li>Weekly check-in, due Sunday night: what you did, what's next, what's blocking you.</li>
      <li>Reply to messages within one business day, even if it's just "got it, will do Thursday."</li>
    </ul>

    <h3>Concert recording</h3>
    <ol>
      <li>By the end of week 3, sign up for concerts on the Google Calendar invitations. Each event's notes list its AV needs.</li>
      <li>One week before, email the ensemble director to confirm: audio, video, or both; stage layout and mic preferences; start and sound check times.</li>
      <li>Day of: gather gear (recorder, camera, mics, stands, cables, SD cards), arrive early, set up, and make a short test recording and play it back.</li>
      <li>During: confirm recording is running at the start, and keep monitoring.</li>
      <li>After: tear down and coil cables properly. Upload to the ensemble archive folder, named <span class="mono">YYYY-MM-DD - Ensemble - Audio</span> (or Video).</li>
      <li>Check that the upload landed and plays before clearing the SD cards, then return gear to its bag. This last step is the one that has gone wrong most often.</li>
    </ol>

    <h3>Updating software on the MTS computers</h3>
    <ol>
      <li>From the master computer, use Remote Desktop to send a thaw and restart to the machines you're updating. Thaw any that miss the command by hand in Deep Freeze.</li>
      <li>Confirm every machine is thawed (gray bear icon with an x) before changing anything.</li>
      <li>Install updates on each machine. AirDrop has been the fastest way to move installers.</li>
      <li>Open the software to clear first-run pop-ups, trash the installers (keep one on the master), clear the desktop, and empty the trash last.</li>
      <li>Freeze each machine again (white bear icon), then thaw, update, and freeze the master.</li>
    </ol>

    <h3>Documentation</h3>
    <p>Every document gets a named author and a lead who publishes it. If you write content for a space you don't lead, work with that lead and they close it out.</p>
